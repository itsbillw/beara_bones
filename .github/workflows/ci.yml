name: CI

on:
  push:
    branches: [main, "modernization/**"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: SKIP=test-all uv run pre-commit run --all-files

      - name: Test
        env:
          DJANGO_SETTINGS_MODULE: beara_bones.settings_dev
          TZ: UTC
        run: |
          cd beara_bones && uv run python manage.py test home data learning
          cd .. && uv run pytest tests/test_football.py -v

  dbt-soda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Prepare fixture DuckDB
        run: uv run python scripts/ci_seed_football_duckdb.py

      - name: dbt build
        run: cd data_modelling && uv run dbt build

      - name: Soda contract verify
        run: |
          uv run soda contract verify \
            --data-source football/soda/ds_config.yml \
            --contract football/soda/contracts/fixtures.yaml
