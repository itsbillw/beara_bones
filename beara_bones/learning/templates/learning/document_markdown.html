{% extends "home/base.html" %}
{% load static %}

{% block header %}
<link href="{% static 'learning/css/learning.css' %}" rel="stylesheet" />
{% endblock %}

{% block content %}
<div class="learning-layout" id="learning-layout">
  {% include "learning/_sidebar.html" %}

  <section class="learning-main">
    <div class="learning-main-header">
      <button
        type="button"
        class="btn btn-link learning-sidebar-toggle"
        id="learning-sidebar-toggle"
        aria-controls="learning-sidebar"
        aria-expanded="true"
        aria-label="Hide sidebar"
      >
        <i class="bi bi-list"></i>
      </button>

      {% include "learning/_breadcrumb.html" %}
    </div>

    <div class="learning-content">
      <div class="learning-doc-header">
        <h1><i class="bi bi-file-earmark-text"></i> {{ document.title }}</h1>
        <form method="post" action="{% url 'learning:document_delete' doc_id=document.id %}" onsubmit="return confirm('Delete this document?');">
          {% csrf_token %}
          <button type="submit" class="btn btn-sm btn-outline-light">Delete</button>
        </form>
      </div>

      <article class="learning-markdown">
        {{ html_content|safe }}
      </article>
    </div>
  </section>
</div>

<script src="{% static 'learning/js/learning.js' %}"></script>
{% endblock %}
