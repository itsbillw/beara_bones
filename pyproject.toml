# beara_bones: Django site (itsbillw). Production: DietPi + MariaDB; dev: SQLite.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">= 3.12"
name = "beara_bones"
version = "0.1.0"
description = "Django based playground"
readme = "README.md"
dependencies = [
    "dbt-duckdb>=1.9.0",
    "django-htmx>=1.21.0",
    "django-rq>=2.10.2",
    "django-redis>=5.4.0",
    "django-storages>=1.14.0",
    "django>=5.1.2",
    "duckdb>=1.0.0",
    "bleach>=6.2.0",
    "gunicorn>=23.0.0",
    "markdown>=3.7",
    "python-frontmatter>=1.1.0",
    "pypdfium2>=4.30.0",
    "minio>=7.2.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "PyMySQL>=1.1.0",
    "python-dotenv>=1.0.1",
    "pyarrow>=18.0.0",
    "redis>=5.0.0",
    "requests>=2.32.0",
    "soda-core>=4.0.7",
    "soda-duckdb>=4.0.7",
    "tzdata>=2024.1",
    "uvicorn-worker>=0.2.0",
    "uvicorn>=0.32.0",
    "whitenoise>=6.8.2",
]

[tool.uv]
dev-dependencies = [
    "bandit>=1.7.0",
    "coverage[toml]>=7.0.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyMySQL>=1.1.0",
    "types-requests>=2.32.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["beara_bones*", "football*", "pi_health*"]

[tool.coverage.run]
source = ["beara_bones", "football", "pi_health"]
omit = ["*/migrations/*", "*/tests.py", "*/test_*.py", "manage.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]
fail_under = 70

[tool.bandit]
skips = ["B101", "B404", "B603", "B607"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"beara_bones/*/management/commands/*.py" = ["B023", "B904", "E501"]
"beara_bones/home/management/commands/*.py" = ["B904"]

[tool.ruff.format]
quote-style = "double"
